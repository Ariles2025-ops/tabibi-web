# Mises a jour de dependances hebdomadaires (pull requests a verifier par la CI : build, tests, image).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # Pas de changement de version majeure automatique avant le lancement (ils cassaient les tests et envoyaient des e-mails d'échec).
    # Les failles connues restent surveillées par Trivy (Securite) ; une version majeure se fait à la main, sur décision.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # Angular se met a jour d'un bloc (core, cli, build, compiler-cli...) : une seule pull request par semaine.
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Pas de changement de version majeure automatique avant le lancement (ils cassaient les tests et envoyaient des e-mails d'échec).
    # Les failles connues restent surveillées par Trivy (Securite) ; une version majeure se fait à la main, sur décision.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    # Pas de changement de version majeure automatique avant le lancement (ils cassaient les tests et envoyaient des e-mails d'échec).
    # Les failles connues restent surveillées par Trivy (Securite) ; une version majeure se fait à la main, sur décision.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
