name: ci
on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  # Un seul outil de test : Playwright. Le projet « logique » s'execute dans node (modules TypeScript purs), le
  # projet « navigateur » dans Chromium, sur le build de production servi par server.ts face a l'API simulee.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Dependances (package-lock.json)
        run: npm ci
      - name: Outillage de test (Playwright seul, aucune spec sous src/)
        run: npm run verif:tests
      - name: Navigateur Playwright (Chromium et ses dependances systeme)
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: "Tests (Playwright : projets logique et navigateur)"
        run: npx playwright test
      - name: Rapport Playwright (en cas d'echec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Image de production publiee sur GHCR : seulement sur la branche principale, une fois les tests verts.
  # Nom attendu par docker-compose.prod.yml de tabibi-backend : ghcr.io/<org>/tabibi-web (tags latest et sha-<commit>).
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nom de l'image en minuscules (exigence de GHCR)
        id: nom
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tabibi-web" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.nom.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
