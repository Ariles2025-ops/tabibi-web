name: ci
on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Dependances (package-lock.json)
        run: npm ci
      - name: Build
        run: npx ng build
      - name: Tests unitaires (Chrome headless, sans bac a sable)
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI

  # Tests de bout en bout : build de production servi par server.ts (SSR) face a l'API simulee, Chromium de Playwright.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Dependances (package-lock.json)
        run: npm ci
      - name: Navigateur Playwright (Chromium et ses dependances systeme)
        run: npx playwright install --with-deps chromium
      - name: Tests de bout en bout (ng build, API simulee + serveur SSR, Playwright)
        run: npm run e2e
      - name: Rapport Playwright (en cas d'echec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Image de production publiee sur GHCR : seulement sur la branche principale, une fois build-test vert.
  # Nom attendu par docker-compose.prod.yml de tabibi-backend : ghcr.io/<org>/tabibi-web (tags latest et sha-<commit>).
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nom de l'image en minuscules (exigence de GHCR)
        id: nom
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tabibi-web" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.nom.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
